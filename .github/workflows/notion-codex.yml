name: Notion to Codex

on:
  schedule:
    # Poll one ready task every 15 minutes. Scheduled workflows run from the
    # default branch, so this becomes active after the setup PR is merged.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      page_id:
        description: Optional Notion page ID to process
        required: false
        type: string

concurrency:
  group: notion-codex-intake
  cancel-in-progress: false

permissions:
  contents: read

env:
  NOTION_API_VERSION: "2026-03-11"
  NOTION_TITLE_PROPERTY: ${{ vars.NOTION_TITLE_PROPERTY || 'Task' }}
  NOTION_STATUS_PROPERTY: ${{ vars.NOTION_STATUS_PROPERTY || 'Status' }}
  NOTION_READY_STATUS: ${{ vars.NOTION_READY_STATUS || 'Ready for Codex' }}
  NOTION_WORKING_STATUS: ${{ vars.NOTION_WORKING_STATUS || 'Coding' }}
  NOTION_REVIEW_STATUS: ${{ vars.NOTION_REVIEW_STATUS || 'Review' }}
  NOTION_BLOCKED_STATUS: ${{ vars.NOTION_BLOCKED_STATUS || 'Blocked' }}
  NOTION_RUN_ID_PROPERTY: ${{ vars.NOTION_RUN_ID_PROPERTY || 'Agent Run ID' }}
  NOTION_PR_URL_PROPERTY: ${{ vars.NOTION_PR_URL_PROPERTY || 'PR URL' }}
  NOTION_RESULT_PROPERTY: ${{ vars.NOTION_RESULT_PROPERTY || 'Agent Result' }}
  NOTION_RISK_PROPERTY: ${{ vars.NOTION_RISK_PROPERTY || 'Risk' }}
  NOTION_ALLOWED_PATHS_PROPERTY: ${{ vars.NOTION_ALLOWED_PATHS_PROPERTY || 'Allowed Paths' }}
  NOTION_VERIFICATION_PROPERTY: ${{ vars.NOTION_VERIFICATION_PROPERTY || 'Verification' }}
  CODEX_VERIFICATION_COMMAND: ${{ vars.CODEX_VERIFICATION_COMMAND || 'uv run pytest' }}

jobs:
  claim:
    name: Claim one Notion task
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_task: ${{ steps.claim.outputs.has_task }}
      page_id: ${{ steps.claim.outputs.page_id }}
      job_id: ${{ steps.claim.outputs.job_id }}
    steps:
      - name: Check out workflow code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Claim the oldest ready task
        id: claim
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_PAGE_ID: ${{ inputs.page_id }}
        run: |
          mkdir -p .codex-runtime
          python scripts/notion_coding.py claim \
            --page-id "$REQUESTED_PAGE_ID" \
            --task-file .codex-runtime/notion-task.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload claimed task
        if: steps.claim.outputs.has_task == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notion-task-${{ github.run_id }}
          path: .codex-runtime/notion-task.json
          if-no-files-found: error
          retention-days: 14

  implement:
    name: Implement and verify
    needs: claim
    if: needs.claim.outputs.has_task == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      verification_exit_code: ${{ steps.verify.outputs.exit_code }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download claimed task
        uses: actions/download-artifact@v4
        with:
          name: notion-task-${{ github.run_id }}
          path: .codex-runtime

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install project dependencies
        run: uv sync --extra dev

      - name: Render trusted Codex prompt
        run: |
          python scripts/notion_coding.py render \
            --task-file .codex-runtime/notion-task.json \
            --template .github/codex/prompts/notion-task.md \
            --output .codex-runtime/notion-task-prompt.md

      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .codex-runtime/notion-task-prompt.md
          output-file: .codex-runtime/codex-result.json
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: >-
            ["--ephemeral", "--output-schema",
            ".github/codex/schemas/notion-result.schema.json"]

      - name: Run deterministic repository verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bash -lc "$CODEX_VERIFICATION_COMMAND" \
            > .codex-runtime/verification.log 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture the Codex patch
        shell: bash
        run: |
          echo ".codex-runtime/" >> .git/info/exclude
          git add -N .
          git diff --binary HEAD > .codex-runtime/codex.patch

      - name: Enforce control-plane boundary
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "-z", "HEAD"]
          ).decode("utf-8").split("\0")
          changed = [path for path in changed if path]

          def forbidden(path: str) -> bool:
              return (
                  path == "AGENTS.md"
                  or path.startswith(".codex/")
                  or path.startswith(".github/workflows/")
                  or path.startswith(".github/codex/")
                  or path == ".env"
                  or (path.startswith(".env.") and path != ".env.example")
                  or path.endswith((".pem", ".key", ".p12"))
              )

          blocked = [path for path in changed if forbidden(path)]
          if blocked:
              raise SystemExit(
                  "Codex changed protected control-plane or secret paths: "
                  + ", ".join(blocked)
              )
          PY

      - name: Upload implementation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-implementation-${{ github.run_id }}
          path: |
            .codex-runtime/notion-task.json
            .codex-runtime/codex-result.json
            .codex-runtime/verification.log
            .codex-runtime/codex.patch
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce publication gates
        shell: bash
        run: |
          test -s .codex-runtime/codex.patch
          test "${{ steps.verify.outputs.exit_code }}" = "0"
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(".codex-runtime/codex-result.json").read_text(encoding="utf-8")
          )
          if result["status"] != "success":
              raise SystemExit(f"Codex result status is {result['status']!r}")
          PY

  publish:
    name: Publish a draft pull request
    needs: [claim, implement]
    if: needs.implement.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_url: ${{ steps.pr.outputs.pr_url }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download implementation evidence
        uses: actions/download-artifact@v4
        with:
          name: notion-implementation-${{ github.run_id }}
          path: .codex-runtime

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare pull request metadata
        id: metadata
        run: |
          python scripts/notion_coding.py pr-metadata \
            --task-file .codex-runtime/notion-task.json \
            --result-file .codex-runtime/codex-result.json \
            --body-file .codex-runtime/pr-body.md \
            --github-output "$GITHUB_OUTPUT" \
            --verification-exit-code "${{ needs.implement.outputs.verification_exit_code }}"

      - name: Apply patch and publish branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN || github.token }}
          PR_TITLE: ${{ steps.metadata.outputs.pr_title }}
          PAGE_ID: ${{ needs.claim.outputs.page_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git apply --index .codex-runtime/codex.patch

          short_page_id="${PAGE_ID//-/}"
          short_page_id="${short_page_id:0:12}"
          branch="codex/notion-${short_page_id}-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch -c "$branch"
          git commit -m "feat: implement claimed Notion task"
          git push origin "$branch"

          pr_url="$(
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "$PR_TITLE" \
              --body-file .codex-runtime/pr-body.md \
              --draft
          )"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

  finalize:
    name: Update Notion
    needs: [claim, implement, publish]
    if: always() && needs.claim.outputs.has_task == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out workflow code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report workflow outcome
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE_ID: ${{ needs.claim.outputs.page_id }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PR_URL: ${{ needs.publish.outputs.pr_url }}
        shell: bash
        run: |
          if [ "$PUBLISH_RESULT" = "success" ]; then
            status="$NOTION_REVIEW_STATUS"
            result="Draft pull request created: $PR_URL"
          else
            status="$NOTION_BLOCKED_STATUS"
            result="Workflow ${GITHUB_RUN_ID} stopped before publication. Review the GitHub Actions run and its artifacts."
          fi

          python scripts/notion_coding.py update \
            --page-id "$PAGE_ID" \
            --status "$status" \
            --pr-url "$PR_URL" \
            --result "$result"
